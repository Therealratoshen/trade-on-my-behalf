name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROGRAM_ID: 4TdJre5rGrGT3Zo5aEfmJmT6wu65BbjFjyLFjrMeJXph
  # setup-anchor prepends the "v" to solana-cli-version itself, so the value
  # is the bare version. 2.2.21 matches the toolchain this repo builds with
  # (cargo build-sbf) and is what the action defaults to.
  SOLANA_CLI_VERSION: 2.2.21
  ANCHOR_VERSION: 0.31.1

jobs:
  workspace:
    name: SDK + agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input — the root package.json `packageManager` field is
      # the single source of truth. Passing both makes pnpm/action-setup
      # abort with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm -r test

  program:
    name: Anchor program tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: actions/cache requires the singular `path:` input. The plural
      # `paths:` is silently ignored and the step fails with
      # "Input required and not supplied: path".
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/treasury/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('programs/treasury/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: dtolnay/rust-toolchain@stable

      # Installs Anchor CLI + Solana CLI + Node in one step. Do NOT also run the
      # Anza `install` script: two competing installs of the same toolchain
      # leave an unpredictable one first on PATH.
      - uses: metadaoproject/setup-anchor@v3.4
        with:
          anchor-version: ${{ env.ANCHOR_VERSION }}
          solana-cli-version: ${{ env.SOLANA_CLI_VERSION }}
          node-version: 20.11.0

      # No `version:` input — see the note in the workspace job above.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # programs/treasury is NOT a member of the root workspace (the root
      # pnpm-workspace.yaml only globs apps/* and packages/*), so it has its own
      # committed pnpm-lock.yaml and installs standalone.
      #
      # --ignore-workspace is required, not cosmetic: the program directory
      # ships a scaffolded pnpm-workspace.yaml containing only `allowBuilds:`
      # and no `packages:` key. Without this flag pnpm reads that file and
      # aborts with ERR_PNPM_INVALID_WORKSPACE_CONFIGURATION.
      - name: Install program deps
        working-directory: programs/treasury
        run: pnpm install --frozen-lockfile --ignore-workspace

      # `anchor build` is a purely local operation: it compiles with
      # cargo build-sbf, then generates target/idl + target/types. It makes no
      # devnet or registry call, and it does not need provider.cluster to be
      # localnet. The provider.cluster = "devnet" in Anchor.toml therefore does
      # not affect this step (deploying is what reads it, and we never deploy).
      - name: Build program
        working-directory: programs/treasury
        run: anchor build

      # The test suite reaches the program through `anchor.workspace`, which
      # reads Anchor.toml, looks up [programs.<provider.cluster>], and finds no
      # [programs.devnet] entry — so it falls back to the IDL address, which
      # `anchor build` writes from declare_id!(). That must equal PROGRAM_ID,
      # which is where the .so gets preloaded below. Fail loudly if it drifts.
      - name: Verify the built IDL targets PROGRAM_ID
        working-directory: programs/treasury
        run: |
          IDL_ADDR=$(node -e "console.log(require('./target/idl/treasury.json').address)")
          echo "IDL address:   $IDL_ADDR"
          echo "PROGRAM_ID:    $PROGRAM_ID"
          test "$IDL_ADDR" = "$PROGRAM_ID" || {
            echo "::error::Built IDL address does not match PROGRAM_ID"; exit 1; }

      # A throwaway wallet under RUNNER_TEMP. Never the repo or the runner's
      # default keypair path. The tests read ANCHOR_WALLET + ANCHOR_PROVIDER_URL.
      - name: Create test wallet
        run: |
          solana-keygen new --no-bip39-passphrase --silent --force -o "$RUNNER_TEMP/test-wallet.json"
          echo "ANCHOR_WALLET=$RUNNER_TEMP/test-wallet.json" >> "$GITHUB_ENV"
          echo "ANCHOR_PROVIDER_URL=http://127.0.0.1:8899" >> "$GITHUB_ENV"
          echo "solana-keygen pubkey \"$RUNNER_TEMP/test-wallet.json\"" > "$RUNNER_TEMP/wallet-pubkey"

      - name: Start local validator with program preloaded
        run: |
          LEDGER="$RUNNER_TEMP/ledger"
          solana-test-validator --reset --quiet --ledger "$LEDGER" \
            --bpf-program "$PROGRAM_ID" programs/treasury/target/deploy/treasury.so \
            > "$RUNNER_TEMP/validator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/validator.pid"
          for _ in $(seq 1 60); do
            solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1 && break
            sleep 1
          done
          solana cluster-version --url http://127.0.0.1:8899

      # Proves the --bpf-program preload actually took, rather than assuming it.
      - name: Verify the program is loaded at PROGRAM_ID
        run: solana program show "$PROGRAM_ID" --url http://127.0.0.1:8899

      - name: Fund the test wallet
        run: solana airdrop 10 "$(cat "$RUNNER_TEMP/wallet-pubkey")" --url http://127.0.0.1:8899

      # Anchor.toml's provider.cluster is "devnet", so `anchor test` would try
      # to DEPLOY to devnet (and fail on insufficient funds). The validator is
      # already running with the program preloaded, so invoke the test script
      # directly instead — the exact command proven to run the suite against a
      # preloaded .so. It must be run from programs/treasury: the suite resolves
      # `../target/types/treasury` and anchor.workspace reads ./Anchor.toml.
      - name: Program tests
        working-directory: programs/treasury
        run: pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts

      - name: Validator log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/validator.log" || true

      - name: Stop validator
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/validator.pid")" 2>/dev/null || true
